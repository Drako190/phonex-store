<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña — PhoneX Store</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;position:relative;z-index:1">
  <div class="modal" style="position:relative;transform:none;max-width:440px;width:100%">
    <a href="../index.html" class="nav-logo" style="display:inline-block;margin-bottom:1.5rem">Phone<span>X</span></a>
    <div class="modal-title">Nueva contraseña</div>
    <div class="modal-subtitle">Ingresa tu nueva contraseña</div>

    <div id="msg" style="display:none;padding:0.85rem;border-radius:8px;margin-bottom:1rem;text-align:center"></div>

    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="form-group">
        <label class="form-label">Nueva contraseña</label>
        <div class="input-icon-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" class="form-input" id="newPass" placeholder="Mín. 8 caracteres" required>
          <span class="input-icon-right" onclick="togglePass()">👁️</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmar contraseña</label>
        <div class="input-icon-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" class="form-input" id="confirmPass" placeholder="Repite la contraseña" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="resetBtn">Restablecer contraseña</button>
    </form>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:5000/api';
const token = new URLSearchParams(window.location.search).get('token');
if (!token) { document.getElementById('resetForm').style.display='none'; showMsg('❌ Token inválido o expirado','error'); }

function togglePass() {
  const i = document.getElementById('newPass');
  i.type = i.type === 'password' ? 'text' : 'password';
}

function showMsg(text, type) {
  const d = document.getElementById('msg');
  d.style.display = 'block';
  d.style.background = type==='success' ? 'rgba(0,230,118,0.1)' : 'rgba(255,82,82,0.1)';
  d.style.border = `1px solid ${type==='success' ? '#00e676' : '#ff5252'}`;
  d.style.color = type==='success' ? '#00e676' : '#ff5252';
  d.textContent = text;
}

async function handleReset(e) {
  e.preventDefault();
  const btn  = document.getElementById('resetBtn');
  const pass = document.getElementById('newPass').value;
  const conf = document.getElementById('confirmPass').value;
  if (pass !== conf) { showMsg('❌ Las contraseñas no coinciden','error'); return; }
  if (pass.length < 8) { showMsg('❌ Mínimo 8 caracteres','error'); return; }
  btn.disabled = true; btn.textContent = 'Actualizando...';
  try {
    const res = await fetch(`${API_BASE}/auth/reset-password/${token}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pass })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    showMsg('✅ ¡Contraseña actualizada! Redirigiendo...','success');
    document.getElementById('resetForm').style.display = 'none';
    setTimeout(() => window.location.href = '../index.html', 2500);
  } catch(err) {
    showMsg('❌ '+err.message,'error');
    btn.disabled = false; btn.textContent = 'Restablecer contraseña';
  }
}
</script>
</body>
</html>
